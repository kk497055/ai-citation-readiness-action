name: AI Citation Readiness Check
description: Score five website clarity, evidence, and crawlability signals in a static site repository.
author: Klyrone Labs
branding:
  icon: check-circle
  color: green
inputs:
  path:
    description: Directory containing the built static website
    required: false
    default: .
outputs:
  score:
    description: Directional citation-readiness score from 0 to 100
runs:
  using: node24
  main: index.js
